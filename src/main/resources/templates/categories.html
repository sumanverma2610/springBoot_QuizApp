
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Categories</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
    }

    .header {
        padding: 25px 6%;
        background: #111827;
        border-bottom: 1px solid #334155;
    }

    .header-content {
        max-width: 1100px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .header h1 {
        margin: 0;
        color: #f8fafc;
        font-size: 28px;
    }

    .header p {
        margin: 7px 0 0;
        color: #94a3b8;
    }

    .nav {
        display: flex;
        gap: 10px;
    }

    .nav a {
        padding: 10px 16px;
        border-radius: 8px;
        background: #334155;
        color: #e2e8f0;
        text-decoration: none;
        transition: 0.3s;
    }

    .nav a:hover {
        background: #475569;
    }

    .logout {
        background: #3f1d25 !important;
        color: #fca5a5 !important;
    }

    .logout:hover {
        background: #7f1d1d !important;
        color: white !important;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
    }

    .card {
        padding: 28px;
        margin-bottom: 25px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
        margin: 0 0 20px;
        color: #f8fafc;
        font-size: 21px;
    }

    .form {
        display: flex;
        gap: 12px;
    }

    .form input {
        flex: 1;
        padding: 13px 15px;
        border: 1px solid #475569;
        border-radius: 9px;
        background: #0f172a;
        color: #f8fafc;
        font-size: 15px;
        outline: none;
    }

    .form input::placeholder {
        color: #64748b;
    }

    .form input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .add-btn {
        padding: 13px 20px;
        border: none;
        border-radius: 9px;
        background: #6366f1;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .add-btn:hover {
        background: #4f46e5;
        transform: translateY(-2px);
    }

    .table-header {
        margin-bottom: 18px;
    }

    .table-header h2 {
        margin: 0;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #334155;
    }

    th {
        background: #312e81;
        color: #f8fafc;
        font-size: 14px;
    }

    td {
        color: #cbd5e1;
    }

    tbody tr:hover {
        background: #263449;
    }

    .category-id {
        color: #a78bfa;
        font-weight: bold;
    }

    .category-name {
        font-weight: 600;
        color: #f1f5f9;
    }

    .delete-btn {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 7px;
        background: #3f1d25;
        color: #fca5a5;
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
    }

    .delete-btn:hover {
        background: #7f1d1d;
        color: white;
    }

    .empty {
        padding: 30px;
        color: #94a3b8;
    }

    @media (max-width: 650px) {
        .header-content {
            flex-direction: column;
            align-items: flex-start;
        }

        .nav {
            width: 100%;
        }

        .nav a {
            flex: 1;
            text-align: center;
        }

        .form {
            flex-direction: column;
        }

        .add-btn {
            width: 100%;
        }

        .container {
            width: 92%;
        }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="header-content">

    <div>
      <h1>📚 Manage Categories</h1>

      <p>
        Create and manage quiz categories.
      </p>
    </div>

    <nav class="nav">

      <a th:href="@{/}">
        🏠 Home
      </a>

      <a class="logout"
         th:href="@{/logout}">
        🚪 Logout
      </a>

    </nav>

  </div>

</header>

<main class="container">

  <!-- Add Category -->

  <section class="card">

    <h2>Add New Category</h2>

    <form class="form"
          th:action="@{/admin/categories/save}"
          method="post">

      <input type="text"
             name="name"
             placeholder="Enter category name"
             required>

      <button class="add-btn"
              type="submit">

        + Add Category

      </button>

    </form>

  </section>

  <!-- Categories -->

  <section class="card">

    <div class="table-header">

      <h2>All Categories</h2>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>

        <tr>
          <th>ID</th>
          <th>Category Name</th>
          <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="category : ${categories}">

          <td class="category-id"
              th:text="${category.id}">
            1
          </td>

          <td class="category-name"
              th:text="${category.name}">
            Java
          </td>

          <td>

            <a class="delete-btn"
               th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
               onclick="return confirm('Are you sure you want to delete this category?');">

              Delete

            </a>

          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">

          <td colspan="3"
              class="empty">

            No categories found.

          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>

</body>
</html>
