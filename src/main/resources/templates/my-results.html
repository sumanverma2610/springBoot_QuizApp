<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Results</title>

    ```
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            color: #333;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>


</head>

<body>

<h2>My Quiz Results</h2>

<table>

    ```
    <thead>
    <tr>
        <th>Category</th>
        <th>Score</th>
        <th>Total Questions</th>
        <th>Percentage</th>
        <th>Status</th>
        <th>Date</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="result : ${results}">

        <!-- Category -->
        <td th:text="${result.category != null ? result.category.name : 'Unknown'}">
            Unknown
        </td>

        <!-- Score -->
        <td th:text="${result.score}">
            8
        </td>

        <!-- Total Questions -->
        <td th:text="${result.totalQuestions}">
            10
        </td>
        <td th:text="${result.totalQuestions > 0 ? (result.score * 100 / result.totalQuestions) + '%' : '0%'}">
            80%
        </td>

        <td th:text="${result.totalQuestions > 0 && (result.score * 100 / result.totalQuestions) >= 40 ? 'PASS' : 'FAIL'}">
            PASS
        </td>

        <!-- Date -->
        <td th:text="${result.quizDate}">
            2026-08-09
        </td>

    </tr>

    <!-- No results message -->
    <tr th:if="${#lists.isEmpty(results)}">
        <td colspan="4">
            No quiz results found.
        </td>
    </tr>

    </tbody>

</table>

<a href="/">Back to Home</a>
<div th:replace="~{fragments/ai-button :: aiButton}"></div>
</body>
</html>
