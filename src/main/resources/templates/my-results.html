
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Quiz Results</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .header {
            padding: 28px 6%;
            background: #111827;
            border-bottom: 1px solid #334155;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            color: #f8fafc;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            color: #94a3b8;
        }

        .home {
            padding: 10px 16px;
            border-radius: 8px;
            background: #334155;
            color: #e2e8f0;
            text-decoration: none;
            white-space: nowrap;
            transition: 0.3s;
        }

        .home:hover {
            background: #475569;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            margin: 0 0 20px;
            color: #f8fafc;
            font-size: 21px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 14px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #312e81;
            color: #f8fafc;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            color: #cbd5e1;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #263449;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .pass {
            color: #4ade80;
            font-weight: bold;
        }

        .fail {
            color: #f87171;
            font-weight: bold;
        }

        .score {
            color: #a78bfa;
            font-weight: bold;
        }

        .empty {
            padding: 35px;
            color: #94a3b8;
        }

        @media (max-width: 650px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-content">

        <div>
            <h1>📊 My Quiz Results</h1>

            <p>
                View your previous quiz performance
            </p>
        </div>

        <a class="home"
           th:href="@{/}">
            🏠 Home
        </a>

    </div>

</header>

<main class="container">

    <div class="card">

        <h2>Previous Attempts</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                <tr>
                    <th>Category</th>
                    <th>Score</th>
                    <th>Total Questions</th>
                    <th>Percentage</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="result : ${results}">

                    <td th:text="${result.category != null ? result.category.name : 'Unknown'}">
                        Unknown
                    </td>

                    <td class="score"
                        th:text="${result.score}">
                        8
                    </td>

                    <td th:text="${result.totalQuestions}">
                        10
                    </td>

                    <td th:text="${result.totalQuestions > 0 ? (result.score * 100 / result.totalQuestions) + '%' : '0%'}">
                        80%
                    </td>

                    <td
                            th:text="${result.totalQuestions > 0 && (result.score * 100 / result.totalQuestions) >= 40 ? 'PASS' : 'FAIL'}"
                            th:class="${result.totalQuestions > 0 && (result.score * 100 / result.totalQuestions) >= 40 ? 'pass' : 'fail'}">
                        PASS
                    </td>

                    <td th:text="${result.quizDate}">
                        2026-08-09
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(results)}">

                    <td colspan="6"
                        class="empty">

                        No quiz results found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</body>
</html>
