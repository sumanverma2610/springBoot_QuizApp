<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h2 {
            margin-bottom: 10px;
            text-align: center;
            color: #a78bfa;
            font-size: 32px;
        }

        .category {
            text-align: center;
            margin-bottom: 30px;
        }

        .category h3 {
            color: #cbd5e1;
            font-weight: normal;
        }

        .category span {
            color: #a78bfa;
            font-weight: bold;
        }

        .question {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .question h3 {
            margin: 0 0 20px;
            color: #f8fafc;
            line-height: 1.5;
        }

        .option {
            display: block;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 9px;
            cursor: pointer;
            color: #cbd5e1;
            transition: 0.2s;
        }

        .option:hover {
            background: #273449;
            border-color: #8b5cf6;
            color: white;
        }

        .option input {
            margin-right: 10px;
            accent-color: #8b5cf6;
        }

        button {
            display: block;
            margin: 30px auto;
            padding: 13px 35px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.45);
        }

        .no-question {
            text-align: center;
            color: #fca5a5;
            background: #1e293b;
            border: 1px solid #7f1d1d;
            padding: 25px;
            border-radius: 12px;
        }

        .no-question a {
            color: #a78bfa;
            text-decoration: none;
        }

        .no-question a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #94a3b8;
            text-decoration: none;
        }

        .back a:hover {
            color: #a78bfa;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>📝 Online Quiz</h2>

    <div class="category">

        <h3>
            Category:
            <span th:text="${category.name}"></span>
        </h3>

    </div>


    <div th:if="${questions.isEmpty()}"
         class="no-question">

        <p>
            No questions available for this category.
        </p>

        <a th:href="@{/quiz}">
            Choose Another Category
        </a>

    </div>


    <form th:if="${!questions.isEmpty()}"
          th:action="@{/submitQuiz}"
          method="post">

        <input type="hidden"
               name="categoryId"
               th:value="${category.id}">


        <div th:each="question, questionStat : ${questions}"
             class="question">

            <h3>

                <span th:text="${questionStat.index + 1}">
                </span>.

                <span th:text="${question.questionTitle}">
                </span>

            </h3>


            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="A">

                <span th:text="${question.optionA}">
                </span>

            </label>


            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="B">

                <span th:text="${question.optionB}">
                </span>

            </label>


            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="C">

                <span th:text="${question.optionC}">
                </span>

            </label>


            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="D">

                <span th:text="${question.optionD}">
                </span>

            </label>

        </div>


        <button type="submit">
            Submit Quiz
        </button>

    </form>


    <div class="back">

        <a th:href="@{/quiz}">
            ← Back to Categories
        </a>

    </div>

</div>

</body>
</html>
