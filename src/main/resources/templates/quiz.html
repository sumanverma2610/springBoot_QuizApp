<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    ```
    <meta charset="UTF-8">

    <title>Quiz</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h2 {
            color: blue;
            text-align: center;
        }

        .category {
            text-align: center;
            margin-bottom: 30px;
        }

        .category h3 {
            color: #333;
        }

        .question {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question h3 {
            margin-bottom: 20px;
            color: #222;
        }

        .option {
            display: block;
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .option:hover {
            background-color: #f0f0f0;
        }

        .option input {
            margin-right: 10px;
        }

        button {
            display: block;
            margin: 30px auto;
            padding: 12px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkgreen;
        }

        .no-question {
            text-align: center;
            color: red;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <!-- Quiz Heading -->

    <h2>Online Quiz</h2>


    <!-- Selected Category -->

    <div class="category">

        <h3>
            Category:
            <span th:text="${category.name}"></span>
        </h3>

    </div>


    <!-- If No Questions -->

    <div th:if="${questions.isEmpty()}"
         class="no-question">

        <p>
            No questions available for this category.
        </p>

        <a th:href="@{/quiz}">
            Choose Another Category
        </a>

    </div>


    <!-- Quiz Form -->

    <form th:if="${!questions.isEmpty()}"
          th:action="@{/submitQuiz}"
          method="post">


        <!-- Selected Category ID -->

        <input type="hidden"
               name="categoryId"
               th:value="${category.id}">


        <!-- Questions -->

        <div th:each="question, questionStat : ${questions}"
             class="question">


            <!-- Question Number + Question -->

            <h3>

            <span th:text="${questionStat.index + 1}">
            </span>.

                <span th:text="${question.questionTitle}">
            </span>

            </h3>


            <!-- Option A -->

            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="A">

                <span th:text="${question.optionA}">
            </span>

            </label>


            <!-- Option B -->

            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="B">

                <span th:text="${question.optionB}">
            </span>

            </label>


            <!-- Option C -->

            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="C">

                <span th:text="${question.optionC}">
            </span>

            </label>


            <!-- Option D -->

            <label class="option">

                <input type="radio"
                       th:name="${'question_' + question.id}"
                       value="D">

                <span th:text="${question.optionD}">
            </span>

            </label>


        </div>


        <!-- Submit Quiz -->

        <button type="submit">

            Submit Quiz

        </button>


    </form>


    <!-- Back to Category -->

    <div class="back">

        <a th:href="@{/quiz}">
            Back to Categories
        </a>

    </div>
    ```

</div>

</body>

</html>
