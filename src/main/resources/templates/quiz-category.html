
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Quiz Categories</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .category-card h3 {
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 22px;
        }

        .start-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .start-btn:hover {
            background: #1d4ed8;
        }

        .no-category {
            text-align: center;
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            color: #f87171;
        }

        .home-btn {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .home-btn:hover {
            background: #475569;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Choose Quiz Category</h1>

    <p class="subtitle">
        Select a category to start your quiz
    </p>


    <!-- Categories -->

    <div class="category-grid"
         th:if="${categories != null and !categories.isEmpty()}">

        <div class="category-card"
             th:each="category : ${categories}">

            <h3 th:text="${category.name}">
                Category Name
            </h3>

            <a class="start-btn"
               th:href="@{/quiz/start(categoryId=${category.id})}">

                Start Quiz

            </a>

        </div>

    </div>


    <!-- No Categories -->

    <div class="no-category"
         th:if="${categories == null or categories.isEmpty()}">

        <p>
            No quiz categories available.
        </p>

    </div>


    <!-- AI Button -->

    <div th:replace="~{fragments/ai-button :: aiButton}"></div>


    <!-- Back Home -->

    <a class="home-btn"
       th:href="@{/}">

        Back to Home

    </a>

</div>
</body>
</html>
