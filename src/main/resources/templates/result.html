
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Result</title>

  <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;

        background:
            radial-gradient(
                circle at top left,
                #e9e4ff,
                transparent 35%
            ),
            linear-gradient(
                135deg,
                #f7f8fc,
                #eef0f8
            );

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px;
    }

    .result-card {

        width: 100%;
        max-width: 550px;

        background: rgba(255,255,255,0.95);

        border-radius: 24px;

        padding: 45px 35px;

        text-align: center;

        box-shadow:
            0 20px 60px rgba(0,0,0,0.12);

        border:
            1px solid rgba(255,255,255,0.8);

        animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {

        from {
            opacity: 0;
            transform: translateY(25px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    .success-icon {

        width: 85px;
        height: 85px;

        margin: 0 auto 20px;

        border-radius: 50%;

        background:
            linear-gradient(
                135deg,
                #6c5ce7,
                #4834d4
            );

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 40px;

        box-shadow:
            0 10px 25px rgba(108,92,231,0.35);
    }

    h1 {

        color: #22223b;

        font-size: 30px;

        margin-bottom: 8px;
    }

    .subtitle {

        color: #777;

        font-size: 15px;

        margin-bottom: 30px;
    }

    .score-box {

        background:
            linear-gradient(
                135deg,
                #f1efff,
                #e9e5ff
            );

        border-radius: 18px;

        padding: 25px;

        margin-bottom: 30px;
    }

    .score-label {

        color: #666;

        font-size: 14px;

        margin-bottom: 8px;
    }

    .score {

        font-size: 48px;

        font-weight: 700;

        color: #5a48d6;
    }

    .score-total {

        font-size: 22px;

        color: #777;
    }

    .actions {

        display: flex;

        flex-direction: column;

        gap: 12px;
    }

    .btn {

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        text-decoration: none;

        padding: 13px 20px;

        border-radius: 12px;

        font-size: 15px;

        font-weight: 600;

        transition: 0.25s ease;
    }

    .btn-primary {

        color: white;

        background:
            linear-gradient(
                135deg,
                #6c5ce7,
                #4834d4
            );

        box-shadow:
            0 7px 18px rgba(108,92,231,0.25);
    }

    .btn-primary:hover {

        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(108,92,231,0.35);
    }

    .btn-secondary {

        color: #5145b5;

        background: #f1efff;
    }

    .btn-secondary:hover {

        background: #e5e1ff;

        transform: translateY(-2px);
    }

    .btn-home {

        color: #555;

        background: #f5f5f5;
    }

    .btn-home:hover {

        background: #eaeaea;

        transform: translateY(-2px);
    }

    .footer-text {

        margin-top: 25px;

        color: #999;

        font-size: 12px;
    }

    @media (max-width: 600px) {

        body {
            padding: 15px;
        }

        .result-card {
            padding: 35px 22px;
        }

        h1 {
            font-size: 25px;
        }

        .score {
            font-size: 42px;
        }

    }

  </style>

</head>

<body>

<div class="result-card">

  <div class="success-icon">
    🎉
  </div>

  <h1>Quiz Completed!</h1>

  <p class="subtitle">
    Great job! Here is your quiz result.
  </p>

  <div class="score-box">

    <div class="score-label">
      Your Score
    </div>

    <div class="score">

      <span th:text="${score}"></span>

      <span class="score-total">
                /
                <span th:text="${total}"></span>
            </span>

    </div>

  </div>

  <div class="actions">

    <a th:href="@{/quiz}"
       class="btn btn-primary">

      🔄 Take Quiz Again

    </a>

    <a th:href="@{/my-results}"
       class="btn btn-secondary">

      📊 View History

    </a>

    <a th:href="@{/}"
       class="btn btn-home">

      🏠 Back to Home

    </a>

  </div>

  <div class="footer-text">
    Keep learning and improving 🚀
  </div>

</div>

<!-- AI Assistant -->

<div th:replace="~{fragments/ai-button :: aiButton}"></div>

</body>

</html>
