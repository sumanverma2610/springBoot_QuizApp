
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
    }

    .header {
        padding: 25px 7%;
        border-bottom: 1px solid #334155;
        background: #111827;
    }

    .header-content {
        max-width: 1200px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .header h1 {
        margin: 0;
        color: #f8fafc;
        font-size: 28px;
    }

    .header p {
        margin: 7px 0 0;
        color: #94a3b8;
    }

    .home {
        padding: 10px 16px;
        border-radius: 8px;
        background: #334155;
        color: #e2e8f0;
        text-decoration: none;
        transition: 0.3s;
    }

    .home:hover {
        background: #475569;
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }

    .card {
        padding: 25px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-4px);
        border-color: #6366f1;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .card h2 {
        margin: 0;
        font-size: 16px;
        color: #cbd5e1;
        font-weight: normal;
    }

    .number {
        margin-top: 15px;
        font-size: 32px;
        font-weight: bold;
        color: #a78bfa;
    }

    .actions-section {
        margin-top: 40px;
        padding: 28px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
    }

    .actions-section h2 {
        margin: 0 0 20px;
        color: #f8fafc;
    }

    .action-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .action-buttons a {
        padding: 14px 18px;
        border: 1px solid #475569;
        border-radius: 9px;
        background: #0f172a;
        color: #e2e8f0;
        text-decoration: none;
        text-align: center;
        transition: 0.3s;
    }

    .action-buttons a:hover {
        background: #312e81;
        border-color: #6366f1;
        transform: translateY(-2px);
    }

    .action-buttons .logout {
        background: #3f1d25;
        border-color: #7f1d1d;
        color: #fca5a5;
    }

    .action-buttons .logout:hover {
        background: #7f1d1d;
        color: white;
    }

    @media (max-width: 900px) {
        .stats {
            grid-template-columns: repeat(2, 1fr);
        }

        .action-buttons {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .header-content {
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .stats,
        .action-buttons {
            grid-template-columns: 1fr;
        }

        .container {
            width: 92%;
        }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="header-content">

    <div>
      <h1>Admin Dashboard</h1>
      <p>Quiz Application Administration</p>
    </div>

    <a class="home" th:href="@{/}">
      🏠 Home
    </a>

  </div>

</header>

<main class="container">

  <!-- Statistics -->

  <div class="stats">

    <div class="card">
      <h2>👨‍🎓 Total Students</h2>

      <div class="number"
           th:text="${totalStudents}">
        0
      </div>
    </div>

    <div class="card">
      <h2>❓ Total Questions</h2>

      <div class="number"
           th:text="${totalQuestions}">
        0
      </div>
    </div>

    <div class="card">
      <h2>📚 Total Categories</h2>

      <div class="number"
           th:text="${totalCategories}">
        0
      </div>
    </div>

    <div class="card">
      <h2>📝 Quiz Attempts</h2>

      <div class="number"
           th:text="${totalAttempts}">
        0
      </div>
    </div>

  </div>

  <!-- Quick Actions -->

  <section class="actions-section">

    <h2>Quick Actions</h2>

    <div class="action-buttons">

      <a th:href="@{/admin/questions}">
        📋 Manage Questions
      </a>

      <a th:href="@{/admin/add-question}">
        ➕ Add Question
      </a>

      <a th:href="@{/admin/categories}">
        📚 Manage Categories
      </a>

      <a th:href="@{/ai/quiz}">
        🤖 Generate AI Quiz
      </a>

      <a th:href="@{/ai/test}">
        🧠 AI Assistant
      </a>

      <a class="logout"
         th:href="@{/logout}">
        🚪 Logout
      </a>

    </div>

  </section>

</main>

</body>
</html>
