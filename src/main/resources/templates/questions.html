<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>All Questions</title>

  <style>
    body {
       margin: 0;
       font-family: Arial, sans-serif;
       background: #0f172a;
       color: #e2e8f0;
   }

   .container {
       width: 90%;
       max-width: 1200px;
       margin: 40px auto;
   }

   .card {
       background: #1e293b;
       border: 1px solid #334155;
       border-radius: 12px;
       padding: 25px;
       box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
   }

   h1, h2, h3 {
       color: #f8fafc;
   }

   button,
   .btn {
       background: #6366f1;
       color: white;
       border: none;
       border-radius: 8px;
       padding: 10px 18px;
       cursor: pointer;
       text-decoration: none;
   }

   button:hover,
   .btn:hover {
       background: #4f46e5;
   }

   input,
   select,
   textarea {
       background: #0f172a;
       color: #e2e8f0;
       border: 1px solid #475569;
       border-radius: 8px;
       padding: 10px;
   }

   table {
       width: 100%;
       border-collapse: collapse;
       background: #1e293b;
   }

   th {
       background: #312e81;
       color: white;
       padding: 14px;
   }

   td {
       border-bottom: 1px solid #334155;
       padding: 12px;
   }

   tr:hover {
       background: #263449;
   }

   .delete-btn {
       background: #dc2626;
   }

   .delete-btn:hover {
       background: #b91c1c;
   }

   .back-btn {
       display: inline-block;
       margin-bottom: 20px;
       color: #a5b4fc;
       text-decoration: none;
   }
  </style>

</head>
<body>

<h2>All Questions</h2>

<a th:href="@{/admin/questions/add}">
  Add New Question
</a>

<br><br>

<table>

  <thead>
  <tr>
    <th>ID</th>
    <th>Question</th>
    <th>Option A</th>
    <th>Option B</th>
    <th>Option C</th>
    <th>Option D</th>
    <th>Correct</th>
    <th>Action</th>
  </tr>
  </thead>

  <tbody>

  <tr th:each="question : ${questions}">

    <td th:text="${question.id}"></td>

    <td th:text="${question.questionTitle}"></td>

    <td th:text="${question.optionA}"></td>

    <td th:text="${question.optionB}"></td>

    <td th:text="${question.optionC}"></td>

    <td th:text="${question.optionD}"></td>

    <td th:text="${question.correctAnswer}"></td>

    <td>
      <a class="delete-btn"
         th:href="@{'/admin/questions/delete/' + ${question.id}}"
         onclick="return confirm('Are you sure you want to delete this question?');">
        Delete
      </a>
    </td>

  </tr>

  <tr th:if="${#lists.isEmpty(questions)}">
    <td colspan="8" class="empty">
      No questions found.
    </td>
  </tr>

  </tbody>

</table>
<div th:replace="~{fragments/ai-button :: aiButton}"></div>
</body>
</html>
