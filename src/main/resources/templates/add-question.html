<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Question</title>
</head>
<body>

<h2>Add New Question</h2>

<form th:action="@{/admin/questions/save}" th:object="${question}" method="post">

  <label>Question</label><br>
  <input type="text" th:field="*{questionTitle}" required>
  <br><br>

  <label>Option A</label><br>
  <input type="text" th:field="*{optionA}" required>
  <br><br>

  <label>Option B</label><br>
  <input type="text" th:field="*{optionB}" required>
  <br><br>

  <label>Option C</label><br>
  <input type="text" th:field="*{optionC}" required>
  <br><br>

  <label>Option D</label><br>
  <input type="text" th:field="*{optionD}" required>
  <br><br>

  <label>Correct Answer</label><br>
  <select th:field="*{correctAnswer}">
    <option value="A">Option A</option>
    <option value="B">Option B</option>
    <option value="C">Option C</option>
    <option value="D">Option D</option>
  </select>

  <br><br>

  <button type="submit">Save Question</button>

</form>

<br>

<a th:href="@{/admin/questions}">View All Questions</a>

</body>
</html>
