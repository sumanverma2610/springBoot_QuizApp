<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Question</title>

  ```
  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: #1e293b;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
        margin: 0 0 8px;
        text-align: center;
        color: #f8fafc;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #cbd5e1;
    }

    input,
    select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #475569;
        border-radius: 9px;
        background: #0f172a;
        color: #f8fafc;
        font-size: 15px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .submit-btn {
        width: 100%;
        margin-top: 10px;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #7c3aed;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .submit-btn:hover {
        background: #6d28d9;
    }

    .back {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: #a78bfa;
        text-decoration: none;
    }

    .back:hover {
        color: #c4b5fd;
    }

    @media (max-width: 600px) {
        .container {
            padding: 25px 20px;
        }

        .options {
            grid-template-columns: 1fr;
        }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Add Question</h1>
  <p class="subtitle">Create a new quiz question</p>

  <form th:action="@{/admin/add-question}" method="post">

    <div class="form-group">
      <label>Question</label>
      <input type="text"
             name="questionTitle"
             placeholder="Enter question"
             required>
    </div>

    <div class="options">

      <div class="form-group">
        <label>Option A</label>
        <input type="text"
               name="optionA"
               placeholder="Enter option A"
               required>
      </div>

      <div class="form-group">
        <label>Option B</label>
        <input type="text"
               name="optionB"
               placeholder="Enter option B"
               required>
      </div>

      <div class="form-group">
        <label>Option C</label>
        <input type="text"
               name="optionC"
               placeholder="Enter option C"
               required>
      </div>

      <div class="form-group">
        <label>Option D</label>
        <input type="text"
               name="optionD"
               placeholder="Enter option D"
               required>
      </div>

    </div>

    <div class="form-group">
      <label>Correct Answer</label>

      <select name="correctAnswer" required>
        <option value="">Select Answer</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>

    <div class="form-group">
      <label>Category</label>

      <select name="categoryId" required>
        <option value="">Select Category</option>

        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}">
        </option>
      </select>
    </div>

    <button type="submit" class="submit-btn">
      Add Question
    </button>

  </form>

  <a class="back" th:href="@{/admin/questions}">
    ← Back to Questions
  </a>
</div>
</body>
</html>
