<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Generate AI Quiz</title>
</head>

<body>

<h2>Generate AI Quiz</h2>


<!-- Success message -->
<div th:if="${message}">
  <p th:text="${message}"></p>
</div>


<!-- Error message -->
<div th:if="${error}">
  <p th:text="${error}"></p>
</div>


<form th:action="@{/ai/quiz/generate}" method="post">

  <!-- Category -->

  <label for="category">
    Category
  </label>

  <select id="category"
          name="categoryId"
          required>

    <option value="">
      -- Select Category --
    </option>

    <option
            th:each="category : ${categories}"
            th:value="${category.id}"
            th:text="${category.name}">
    </option>

  </select>

  <br><br>


  <!-- Topic -->

  <label for="topic">
    Quiz Topic
  </label>

  <input
          type="text"
          id="topic"
          name="topic"
          placeholder="Example: Java Collections"
          required
  >

  <br><br>


  <!-- Number of Questions -->

  <label for="numberOfQuestions">
    Number of Questions
  </label>

  <input
          type="number"
          id="numberOfQuestions"
          name="numberOfQuestions"
          min="1"
          max="20"
          value="5"
          required
  >

  <br><br>


  <button type="submit">
    Generate Quiz
  </button>

</form>
<div th:replace="~{fragments/ai-button :: aiButton}"></div>
</body>

</html>
