<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .response {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Gemini AI Test</h1>

    <form th:action="@{/ai/generate}" method="post">

        <label for="prompt">
            Enter your prompt:
        </label>

        <textarea
                id="prompt"
                name="prompt"
                placeholder="Ask something to Gemini..."
                required></textarea>

        <button type="submit">
            Generate
        </button>

    </form>

    <div class="response" th:if="${response != null}">

        <h3>AI Response:</h3>

        <p th:text="${response}"></p>

    </div>

</div>

</body>

</html>
