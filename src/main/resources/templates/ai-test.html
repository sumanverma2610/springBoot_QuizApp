
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        .ai-container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .ai-header {
            background: linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
            );

            color: white;
            padding: 25px;
            text-align: center;
        }

        .ai-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .ai-header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .chat-area {
            padding: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 130px;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            resize: vertical;

            outline: none;
        }

        textarea:focus {
            border-color: #6c5ce7;
        }

        .generate-btn {
            width: 100%;
            margin-top: 15px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #6c5ce7;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .generate-btn:hover {
            background: #4834d4;
        }

        .response-box {
            margin-top: 25px;

            padding: 20px;

            background: #f5f5ff;

            border-left: 5px solid #6c5ce7;

            border-radius: 8px;
        }

        .response-box h3 {
            margin-top: 0;
            color: #4834d4;
        }

        .response-text {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;

            margin: 20px 0;

            text-decoration: none;
            color: #6c5ce7;
        }

    </style>

</head>

<body>

<div class="ai-container">

    <div class="ai-header">

        <h1>🤖 AI Assistant</h1>

        <p>
            Ask Gemini anything related to your quiz or studies
        </p>

    </div>


    <div class="chat-area">

        <form th:action="@{/ai/generate}"
              method="post">

            <label for="prompt">
                Ask your question
            </label>

            <textarea
                    id="prompt"
                    name="prompt"
                    placeholder="Example: Explain Java inheritance in simple words..."
                    required></textarea>

            <button
                    type="submit"
                    class="generate-btn">

                🤖 Ask AI

            </button>

        </form>


        <!-- AI Response -->

        <div class="response-box"
             th:if="${response != null}">

            <h3>🤖 AI Response</h3>

            <div class="response-text"
                 th:text="${response}">
            </div>

        </div>

    </div>

</div>


<a th:href="@{/}"
   class="back-link">

    ← Back to Home

</a>

</body>

</html>
