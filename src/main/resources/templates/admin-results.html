<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>All Quiz Results</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f6fa;
        }

        h2 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>All Student Quiz Results</h2>

<table>

    <thead>
    <tr>
        <th>Student</th>
        <th>Category</th>
        <th>Score</th>
        <th>Total Questions</th>
        <th>Percentage</th>
        <th>Date</th>
        <th>Status</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="result : ${results}">

        <!-- Student -->
        <td th:text="${result.user != null ? result.user.username : 'Unknown'}">
            student
        </td>

        <!-- Category -->
        <td th:text="${result.category != null ? result.category.name : 'Unknown'}">
            Java
        </td>

        <!-- Score -->
        <td th:text="${result.score}">
            8
        </td>

        <!-- Total -->
        <td th:text="${result.totalQuestions}">
            10
        </td>

        <!-- Percentage -->
        <td th:text="${result.totalQuestions > 0 ? (result.score * 100 / result.totalQuestions) + '%' : '0%'}">
            80%
        </td>

        <!-- Date -->
        <td th:text="${result.quizDate}">
            2026-08-09
        </td>

        <!-- Status -->
        <td
                th:text="${result.totalQuestions > 0 && (result.score * 100 / result.totalQuestions) >= 40 ? 'PASS' : 'FAIL'}"
                th:class="${result.totalQuestions > 0 && (result.score * 100 / result.totalQuestions) >= 40 ? 'pass' : 'fail'}">
            PASS
        </td>

    </tr>

    <tr th:if="${#lists.isEmpty(results)}">
        <td colspan="7">
            No quiz results found.
        </td>
    </tr>

    </tbody>

</table>

<a href="/">Back to Home</a>

</body>
</html>
