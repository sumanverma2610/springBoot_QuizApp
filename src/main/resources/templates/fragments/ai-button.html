
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="aiButton">

    <!-- ================= AI FLOATING BUTTON ================= -->

    <button type="button"
            class="ai-floating-button"
            onclick="toggleAIChat()"
            title="AI Assistant">

        <span class="ai-robot">🤖</span>

        <span class="ai-pulse"></span>

    </button>


    <!-- ================= AI CHAT WINDOW ================= -->

    <div id="aiChatWindow"
         class="ai-chat-window">


        <!-- ================= HEADER ================= -->

        <div class="ai-chat-header">

            <div class="ai-title">

                <div class="ai-avatar">
                    🤖
                </div>

                <div class="ai-title-text">

                    <strong>
                        AI Assistant
                    </strong>

                    <span>
                        <i></i>
                        Online
                    </span>

                </div>

            </div>


            <div class="ai-header-buttons">

                <button type="button"
                        class="ai-header-btn"
                        onclick="clearAIChat()"
                        title="Clear chat">

                    🗑️

                </button>

                <button type="button"
                        class="ai-header-btn close"
                        onclick="toggleAIChat()"
                        title="Close">

                    ×

                </button>

            </div>

        </div>


        <!-- ================= MESSAGES ================= -->

        <div id="aiMessages"
             class="ai-messages">

            <div class="ai-message ai-bot-message">

                <div class="message-avatar">
                    🤖
                </div>

                <div class="message-content">

                    <strong>Hello! 👋</strong>

                    <p>
                        I'm your AI Assistant. How can I help you today?
                    </p>

                    <div class="suggestions">

                        <button type="button"
                                onclick="askSuggestion('Explain Java')">

                            ☕ Java

                        </button>

                        <button type="button"
                                onclick="askSuggestion('Explain Spring Boot')">

                            🌱 Spring Boot

                        </button>

                        <button type="button"
                                onclick="askSuggestion('Help me with programming')">

                            💻 Programming

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= INPUT ================= -->

        <form id="aiForm"
              class="ai-input-area">

            <textarea
                    id="aiPrompt"
                    name="prompt"
                    placeholder="Ask anything..."
                    rows="1"
                    required></textarea>

            <button type="submit"
                    class="ai-send-button">

                ➤

            </button>

        </form>


        <div class="ai-footer">

            AI Assistant can make mistakes. Check important information.

        </div>

    </div>


    <!-- ================= CSS ================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        /* =================================================
           FLOATING BUTTON
           ================================================= */

        .ai-floating-button {

            position: fixed;

            right: 28px;
            bottom: 28px;

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #7c6cf0,
                    #5141d8
                );

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 28px;

            box-shadow:
                0 10px 30px
                rgba(81,65,216,0.4);

            z-index: 9999;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .ai-floating-button:hover {

            transform:
                translateY(-4px)
                scale(1.05);

            box-shadow:
                0 15px 35px
                rgba(81,65,216,0.5);

        }


        .ai-floating-button:active {

            transform: scale(0.94);

        }


        .ai-robot {

            position: relative;

            z-index: 2;

        }


        .ai-pulse {

            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            border:
                2px solid
                rgba(124,108,240,0.5);

            animation:
                aiPulse 2s infinite;

        }


        @keyframes aiPulse {

            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            70% {
                transform: scale(1.35);
                opacity: 0;
            }

            100% {
                transform: scale(1.35);
                opacity: 0;
            }

        }


        /* =================================================
           CHAT WINDOW
           ================================================= */

        .ai-chat-window {

            position: fixed;

            right: 28px;
            bottom: 105px;

            width: 390px;

            height: 570px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            display: none;

            flex-direction: column;

            z-index: 10000;

            border:
                1px solid #e7e7ef;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.2);

            animation:
                aiChatOpen 0.25s ease;

        }


        @keyframes aiChatOpen {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(0.96);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =================================================
           HEADER
           ================================================= */

        .ai-chat-header {

            height: 75px;

            padding:
                12px 15px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .ai-title {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .ai-avatar {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.18);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 25px;

            border:
                1px solid
                rgba(255,255,255,0.25);

        }


        .ai-title-text strong {

            display: block;

            font-size: 16px;

            margin-bottom: 4px;

        }


        .ai-title-text span {

            display: flex;

            align-items: center;

            gap: 5px;

            font-size: 11px;

            opacity: 0.9;

        }


        .ai-title-text i {

            width: 7px;
            height: 7px;

            background: #55efc4;

            border-radius: 50%;

            display: inline-block;

        }


        /* =================================================
           HEADER BUTTONS
           ================================================= */

        .ai-header-buttons {

            display: flex;

            gap: 4px;

        }


        .ai-header-btn {

            width: 35px;
            height: 35px;

            border: none;

            border-radius: 9px;

            background:
                rgba(255,255,255,0.1);

            color: white;

            cursor: pointer;

            font-size: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: 0.2s;

        }


        .ai-header-btn:hover {

            background:
                rgba(255,255,255,0.2);

        }


        .ai-header-btn.close {

            font-size: 25px;

        }


        /* =================================================
           MESSAGE AREA
           ================================================= */

        .ai-messages {

            flex: 1;

            padding: 18px;

            overflow-y: auto;

            background:
                #f7f7fb;

            scroll-behavior: smooth;

        }


        .ai-messages::-webkit-scrollbar {

            width: 5px;

        }


        .ai-messages::-webkit-scrollbar-thumb {

            background: #c9c7dc;

            border-radius: 10px;

        }


        /* =================================================
           MESSAGE
           ================================================= */

        .ai-message {

            display: flex;

            gap: 8px;

            margin-bottom: 15px;

            animation:
                messageAppear 0.25s ease;

        }


        @keyframes messageAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .message-avatar {

            width: 30px;
            height: 30px;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 16px;

        }


        .message-content {

            max-width: 82%;

            padding:
                12px 14px;

            border-radius: 14px;

            background: white;

            color: #333;

            border:
                1px solid #e6e6ed;

            border-top-left-radius: 4px;

            font-size: 13px;

            line-height: 1.5;

        }


        .message-content strong {

            color: #4134a5;

        }


        .message-content p {

            margin-top: 7px;

            color: #555;

        }


        /* =================================================
           USER MESSAGE
           ================================================= */

        .ai-user-message {

            justify-content: flex-end;

        }


        .ai-user-message .message-content {

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #5141d8
                );

            color: white;

            border: none;

            border-radius: 14px;

            border-top-right-radius: 4px;

            max-width: 82%;

        }


        /* =================================================
           SUGGESTIONS
           ================================================= */

        .suggestions {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 12px;

        }


        .suggestions button {

            border:
                1px solid #ddd9ff;

            background:
                #f5f3ff;

            color:
                #5141b4;

            border-radius: 20px;

            padding:
                6px 10px;

            font-size: 11px;

            cursor: pointer;

            transition: 0.2s;

        }


        .suggestions button:hover {

            background: #e9e5ff;

        }


        /* =================================================
           INPUT
           ================================================= */

        .ai-input-area {

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 12px;

            background: white;

            border-top:
                1px solid #e8e8ee;

        }


        .ai-input-area textarea {

            flex: 1;

            min-height: 42px;

            max-height: 100px;

            resize: none;

            border:
                1px solid #dedee7;

            border-radius: 14px;

            padding:
                11px 13px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 13px;

            outline: none;

            transition: 0.2s;

        }


        .ai-input-area textarea:focus {

            border-color:
                #6c5ce7;

            box-shadow:
                0 0 0 3px
                rgba(108,92,231,0.1);

        }


        /* =================================================
           SEND BUTTON
           ================================================= */

        .ai-send-button {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            color: white;

            font-size: 19px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            transition: 0.2s;

        }


        .ai-send-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(108,92,231,0.3);

        }


        /* =================================================
           FOOTER
           ================================================= */

        .ai-footer {

            text-align: center;

            font-size: 9px;

            color: #aaa;

            padding:
                5px 10px 8px;

            background: white;

        }


        /* =================================================
           LOADING
           ================================================= */

        .ai-loading {

            opacity: 0.65;

        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 600px) {

            .ai-chat-window {

                right: 10px;
                left: 10px;

                bottom: 85px;

                width: auto;

                height:
                    calc(100vh - 120px);

                max-height: 600px;

                border-radius: 18px;

            }


            .ai-floating-button {

                right: 15px;

                bottom: 15px;

                width: 56px;
                height: 56px;

            }

        }

    </style>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function toggleAIChat() {

            const chat =
                document.getElementById("aiChatWindow");

            if (chat.style.display === "flex") {

                chat.style.display = "none";

            } else {

                chat.style.display = "flex";

                setTimeout(() => {

                    document
                        .getElementById("aiPrompt")
                        .focus();

                }, 100);

            }

        }


        /* =================================================
           SEND MESSAGE
           ================================================= */

        document
            .getElementById("aiForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const promptInput =
                        document.getElementById("aiPrompt");

                    const messages =
                        document.getElementById("aiMessages");

                    const prompt =
                        promptInput.value.trim();

                    if (!prompt) {
                        return;
                    }


                    /* USER MESSAGE */

                    const userMessage =
                        document.createElement("div");

                    userMessage.className =
                        "ai-message ai-user-message";


                    const userContent =
                        document.createElement("div");

                    userContent.className =
                        "message-content";

                    userContent.textContent =
                        prompt;

                    userMessage.appendChild(
                        userContent
                    );

                    messages.appendChild(
                        userMessage
                    );


                    promptInput.value = "";


                    /* LOADING */

                    const loadingMessage =
                        document.createElement("div");

                    loadingMessage.className =
                        "ai-message ai-bot-message ai-loading";


                    const loadingAvatar =
                        document.createElement("div");

                    loadingAvatar.className =
                        "message-avatar";

                    loadingAvatar.textContent =
                        "🤖";


                    const loadingContent =
                        document.createElement("div");

                    loadingContent.className =
                        "message-content";

                    loadingContent.textContent =
                        "🤖 Thinking...";


                    loadingMessage.appendChild(
                        loadingAvatar
                    );

                    loadingMessage.appendChild(
                        loadingContent
                    );


                    messages.appendChild(
                        loadingMessage
                    );


                    messages.scrollTop =
                        messages.scrollHeight;


                    try {

                        const response =
                            await fetch(
                                "/ai/generate",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/x-www-form-urlencoded"

                                    },

                                    body:
                                        "prompt=" +
                                        encodeURIComponent(
                                            prompt
                                        )

                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Server error"
                            );

                        }


                        const result =
                            await response.text();


                        loadingMessage.classList
                            .remove(
                                "ai-loading"
                            );


                        loadingContent.textContent =
                            result;


                    } catch (error) {

                        console.error(error);

                        loadingMessage.classList
                            .remove(
                                "ai-loading"
                            );


                        loadingContent.textContent =
                            "❌ Sorry, something went wrong. Please try again.";

                    }


                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );


        /* =================================================
           ENTER TO SEND
           ================================================= */

        document
            .getElementById("aiPrompt")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        document
                            .getElementById("aiForm")
                            .dispatchEvent(
                                new Event("submit")
                            );

                    }

                }
            );


        /* =================================================
           SUGGESTION BUTTON
           ================================================= */

        function askSuggestion(text) {

            const input =
                document.getElementById("aiPrompt");

            input.value = text;

            document
                .getElementById("aiForm")
                .dispatchEvent(
                    new Event("submit")
                );

        }


        /* =================================================
           CLEAR CHAT
           ================================================= */

        function clearAIChat() {

            const messages =
                document.getElementById("aiMessages");


            messages.innerHTML = `

                <div class="ai-message ai-bot-message">

                    <div class="message-avatar">
                        🤖
                    </div>

                    <div class="message-content">

                        <strong>Hello again! 👋</strong>

                        <p>
                            Chat cleared. What would you
                            like to learn?
                        </p>

                        <div class="suggestions">

                            <button type="button"
                                    onclick="askSuggestion('Explain Java')">
                                ☕ Java
                            </button>

                            <button type="button"
                                    onclick="askSuggestion('Explain Spring Boot')">
                                🌱 Spring Boot
                            </button>

                            <button type="button"
                                    onclick="askSuggestion('Help me with programming')">
                                💻 Programming
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }

    </script>

</div>

</body>
</html>
