
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
</head>

<body>

<!-- =====================================================
     AI ASSISTANT FRAGMENT
     ===================================================== -->

<div th:fragment="aiButton">


    <!-- =================================================
         FLOATING AI BUTTON
         ================================================= -->

    <button type="button"
            class="ai-floating-button"
            onclick="toggleAIChat()"
            title="AI Assistant">

        🤖

    </button>


    <!-- =================================================
         AI CHAT WINDOW
         ================================================= -->

    <div id="aiChatWindow"
         class="ai-chat-window">


        <!-- ================= HEADER ================= -->

        <div class="ai-chat-header">

            <div class="ai-title">

                <span class="ai-icon">
                    🤖
                </span>

                <div>

                    <strong>
                        AI Assistant
                    </strong>

                    <small>
                        Ask me anything
                    </small>

                </div>

            </div>


            <div class="ai-header-buttons">

                <!-- Clear Chat -->

                <button type="button"
                        class="ai-clear-btn"
                        onclick="clearAIChat()"
                        title="Clear Chat">

                    🗑

                </button>


                <!-- Close -->

                <button type="button"
                        class="ai-close-btn"
                        onclick="toggleAIChat()"
                        title="Close">

                    ×

                </button>

            </div>

        </div>


        <!-- ================= MESSAGES ================= -->

        <div id="aiMessages"
             class="ai-messages">


            <!-- Initial AI message -->

            <div class="ai-message ai-bot-message">

                👋 Hi!

                <br><br>

                I'm your AI Assistant.

                <br><br>

                You can ask me about:

                <br>

                • Java

                <br>

                • Spring Boot

                <br>

                • Programming

                <br>

                • Quiz questions

                <br>

                • General study topics

            </div>

        </div>


        <!-- ================= INPUT ================= -->

        <form id="aiForm"
              class="ai-input-area">


            <textarea
                    id="aiPrompt"
                    name="prompt"
                    placeholder="Ask something..."
                    rows="1"
                    required></textarea>


            <button type="submit"
                    class="ai-send-button"
                    title="Send">

                ➤

            </button>

        </form>


    </div>


    <!-- =================================================
         CSS
         ================================================= -->

    <style>

        /* ===============================================
           FLOATING BUTTON
           =============================================== */

        .ai-floating-button {

            position: fixed;

            right: 25px;
            bottom: 25px;

            width: 60px;
            height: 60px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            color: white;

            font-size: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.3);

            z-index: 9999;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        .ai-floating-button:hover {

            transform: scale(1.12);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.4);

        }


        .ai-floating-button:active {

            transform: scale(0.95);

        }


        /* ===============================================
           CHAT WINDOW
           =============================================== */

        .ai-chat-window {

            position: fixed;

            right: 25px;
            bottom: 100px;

            width: 370px;

            height: 520px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 8px 35px
                rgba(0, 0, 0, 0.25);

            overflow: hidden;

            display: none;

            flex-direction: column;

            z-index: 10000;

            border:
                1px solid #e5e5e5;

        }


        /* ===============================================
           HEADER
           =============================================== */

        .ai-chat-header {

            height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 15px;

        }


        .ai-title {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .ai-icon {

            font-size: 30px;

        }


        .ai-title strong {

            display: block;

            font-size: 17px;

        }


        .ai-title small {

            display: block;

            margin-top: 3px;

            opacity: 0.85;

            font-size: 12px;

        }


        /* ===============================================
           HEADER BUTTONS
           =============================================== */

        .ai-header-buttons {

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .ai-clear-btn,
        .ai-close-btn {

            background: transparent;

            border: none;

            color: white;

            cursor: pointer;

            border-radius: 5px;

        }


        .ai-clear-btn {

            font-size: 16px;

            padding: 7px;

        }


        .ai-close-btn {

            font-size: 28px;

            padding: 2px 7px;

            line-height: 1;

        }


        .ai-clear-btn:hover,
        .ai-close-btn:hover {

            background:
                rgba(255,255,255,0.15);

        }


        /* ===============================================
           MESSAGE AREA
           =============================================== */

        .ai-messages {

            flex: 1;

            padding: 15px;

            overflow-y: auto;

            background: #f7f7fb;

        }


        /* ===============================================
           MESSAGE
           =============================================== */

        .ai-message {

            max-width: 85%;

            padding: 11px 14px;

            margin-bottom: 12px;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;

        }


        /* AI MESSAGE */

        .ai-bot-message {

            background: white;

            color: #333;

            border:
                1px solid #e5e5e5;

            border-top-left-radius: 4px;

        }


        /* USER MESSAGE */

        .ai-user-message {

            background:
                #6c5ce7;

            color: white;

            margin-left: auto;

            border-top-right-radius: 4px;

        }


        /* LOADING */

        .ai-loading {

            opacity: 0.7;

            font-style: italic;

        }


        /* ===============================================
           INPUT AREA
           =============================================== */

        .ai-input-area {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px;

            background: white;

            border-top:
                1px solid #e5e5e5;

        }


        .ai-input-area textarea {

            flex: 1;

            resize: none;

            border:
                1px solid #ddd;

            border-radius: 20px;

            padding:
                10px 14px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            outline: none;

            max-height: 100px;

        }


        .ai-input-area textarea:focus {

            border-color:
                #6c5ce7;

        }


        /* ===============================================
           SEND BUTTON
           =============================================== */

        .ai-send-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #4834d4
                );

            color: white;

            font-size: 20px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

        }


        .ai-send-button:hover {

            opacity: 0.9;

        }


        /* ===============================================
           MOBILE
           =============================================== */

        @media (max-width: 600px) {

            .ai-chat-window {

                right: 10px;

                bottom: 85px;

                width:
                    calc(100% - 20px);

                height: 70vh;

            }


            .ai-floating-button {

                right: 15px;

                bottom: 15px;

            }

        }

    </style>


    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script>

        /* ===============================================
           OPEN / CLOSE CHAT
           =============================================== */

        function toggleAIChat() {

            const chat =
                document.getElementById(
                    "aiChatWindow"
                );

            if (chat.style.display === "flex") {

                chat.style.display = "none";

            } else {

                chat.style.display = "flex";

                document
                    .getElementById("aiPrompt")
                    .focus();

            }

        }


        /* ===============================================
           SEND MESSAGE
           =============================================== */

        document
            .getElementById("aiForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const promptInput =
                        document.getElementById(
                            "aiPrompt"
                        );

                    const messages =
                        document.getElementById(
                            "aiMessages"
                        );


                    const prompt =
                        promptInput.value.trim();


                    if (!prompt) {

                        return;

                    }


                    /* =================================
                       USER MESSAGE
                       ================================= */

                    const userMessage =
                        document.createElement("div");


                    userMessage.className =
                        "ai-message ai-user-message";


                    userMessage.textContent =
                        prompt;


                    messages.appendChild(
                        userMessage
                    );


                    /* Clear input */

                    promptInput.value = "";


                    /* =================================
                       LOADING MESSAGE
                       ================================= */

                    const loadingMessage =
                        document.createElement("div");


                    loadingMessage.className =
                        "ai-message ai-bot-message ai-loading";


                    loadingMessage.textContent =
                        "🤖 Thinking...";


                    messages.appendChild(
                        loadingMessage
                    );


                    messages.scrollTop =
                        messages.scrollHeight;


                    try {


                        /* =============================
                           SEND TO SPRING BOOT
                           ============================= */

                        const response =
                            await fetch(
                                "/ai/generate",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/x-www-form-urlencoded"

                                    },

                                    body:
                                        "prompt=" +
                                        encodeURIComponent(
                                            prompt
                                        )

                                }
                            );


                        /* Check response */

                        if (!response.ok) {

                            throw new Error(
                                "Server error"
                            );

                        }


                        /* Get AI response */

                        const result =
                            await response.text();


                        /* Replace loading */

                        loadingMessage.classList
                            .remove(
                                "ai-loading"
                            );


                        loadingMessage.textContent =
                            result;


                    } catch (error) {


                        console.error(error);


                        loadingMessage.classList
                            .remove(
                                "ai-loading"
                            );


                        loadingMessage.textContent =
                            "❌ Sorry, something went wrong. Please try again.";

                    }


                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );


        /* ===============================================
           ENTER TO SEND
           =============================================== */

        document
            .getElementById("aiPrompt")
            .addEventListener(
                "keydown",
                function(event) {


                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();


                        document
                            .getElementById("aiForm")
                            .dispatchEvent(
                                new Event("submit")
                            );

                    }

                }
            );


        /* ===============================================
           CLEAR CHAT
           =============================================== */

        function clearAIChat() {

            const messages =
                document.getElementById(
                    "aiMessages"
                );


            messages.innerHTML = `

                <div class="ai-message ai-bot-message">

                    👋 Hi!

                    <br><br>

                    I'm your AI Assistant.

                    <br><br>

                    You can ask me about:

                    <br>

                    • Java

                    <br>

                    • Spring Boot

                    <br>

                    • Programming

                    <br>

                    • Quiz questions

                    <br>

                    • General study topics

                </div>

            `;

        }

    </script>


</div>

</body>

</html>
