spring.application.name=QuizApplication

# Gemini AI - set GEMINI_API_KEY as an environment variable, both locally
# and on your hosting platform. Nothing secret is stored in this file.
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

# Database - no spring.datasource.* lines here on purpose. Spring Boot
# reads SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
# SPRING_DATASOURCE_PASSWORD directly from the environment automatically,
# so nothing sensitive needs to live in this file or in git at all.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
server.port=${PORT:8080}